# Gateway do PriceHub: uma porta (8080), rotas separadas por prefixo.
#
#   /                      comparador (React): /, /medicamento/{id}, /parceiras
#   /monitor/              monitor de eventos (outro micro-frontend)
#   /api/<serviço>/...     ms-ingestao, ms-catalogo e ms-log (prefixo removido)
#   /loja/<farmácia>/...   site e /admin de cada farmácia (prefixo removido e enviado em X-Forwarded-Prefix)
#
# Os destinos ficam em variáveis e são resolvidos pelo DNS do Docker a cada requisição: o gateway
# sobe mesmo com uma farmácia desligada (demonstração em etapas) e responde 502 só para ela.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $conexao { default upgrade; "" ""; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection $conexao;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # SSE (/api/catalogo/tempo-real e /api/log/registros/tempo-real): sem buffer e conexão longa.
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;

  # ----- microsserviços -------------------------------------------------------------
  location /api/ingestao/ { set $alvo ms-ingestao:8001; rewrite ^/api/ingestao/(.*)$ /$1 break; proxy_pass http://$alvo; }
  location /api/catalogo/ { set $alvo ms-catalogo:8002; rewrite ^/api/catalogo/(.*)$ /$1 break; proxy_pass http://$alvo; }
  location /api/log/      { set $alvo ms-log:8003;      rewrite ^/api/log/(.*)$ /$1 break;      proxy_pass http://$alvo; }

  # ----- farmácias ------------------------------------------------------------------
  location = /loja/biofarma     { return 301 /loja/biofarma/; }
  location = /loja/farmaazul    { return 301 /loja/farmaazul/; }
  location = /loja/drogapopular { return 301 /loja/drogapopular/; }

  location /loja/biofarma/ {
    set $alvo farmacia-biofarma:8101;
    proxy_set_header X-Forwarded-Prefix /loja/biofarma;
    rewrite ^/loja/biofarma/(.*)$ /$1 break;
    proxy_pass http://$alvo;
  }
  location /loja/farmaazul/ {
    set $alvo farmacia-farmaazul:8102;
    proxy_set_header X-Forwarded-Prefix /loja/farmaazul;
    rewrite ^/loja/farmaazul/(.*)$ /$1 break;
    proxy_pass http://$alvo;
  }
  location /loja/drogapopular/ {
    set $alvo farmacia-drogapopular:8103;
    proxy_set_header X-Forwarded-Prefix /loja/drogapopular;
    rewrite ^/loja/drogapopular/(.*)$ /$1 break;
    proxy_pass http://$alvo;
  }

  # ----- micro-frontends ------------------------------------------------------------
  location = /monitor { return 301 /monitor/; }
  location /monitor/ { try_files $uri /monitor/index.html; }

  location / {
    root /usr/share/nginx/html/comparador;
    try_files $uri /index.html;
  }
}
