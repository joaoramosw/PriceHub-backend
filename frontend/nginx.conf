# Um servidor por micro-frontend: são implantações independentes que só compartilham pacotes de código.
server { listen 5173; root /usr/share/nginx/html/comparador; location / { try_files $uri /index.html; } }
server { listen 5174; root /usr/share/nginx/html/lojas;      location / { try_files $uri /index.html; } }
server { listen 5175; root /usr/share/nginx/html/monitor;    location / { try_files $uri /index.html; } }
server { listen 5176; root /usr/share/nginx/html/vitrines;   location / { try_files $uri /index.html; } }
