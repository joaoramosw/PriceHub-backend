# PriceHub: microsserviços orientados a eventos.
#
# Subir tudo:            docker compose up -d --build
# Demonstração em etapas (capítulo de resultados):
#   1) docker compose up -d --build postgres rabbitmq ms-ingestao ms-catalogo ms-log frontend
#   2) docker compose up -d farmacia-biofarma   (depois farmacia-farmaazul e farmacia-drogapopular)
#   3) altere um preço em http://localhost:5174 e acompanhe em http://localhost:5175

x-servico-python: &servico-python
  restart: unless-stopped
  environment: &ambiente-comum
    RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-pricehub}:${RABBITMQ_SENHA:-pricehub}@rabbitmq:5672/
    NIVEL_DE_LOG: ${NIVEL_DE_LOG:-INFO}
    CORS_ORIGENS: "*"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-farmacia: &farmacia
  build:
    context: ./backend
    args:
      SERVICO: ms-farmacia
  image: pricehub/ms-farmacia:local
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:-pricehub}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:-pricehub}
      POSTGRES_DB: pricehub
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USUARIO:-pricehub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:-pricehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_SENHA:-pricehub}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - dados-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  ms-ingestao:
    <<: *servico-python
    build:
      context: ./backend
      args:
        SERVICO: ms-ingestao
    image: pricehub/ms-ingestao:local
    environment:
      <<: *ambiente-comum
      PORTA: "8001"
      URL_DO_BANCO: postgresql+asyncpg://${POSTGRES_USUARIO:-pricehub}:${POSTGRES_SENHA:-pricehub}@postgres:5432/ingestao
      URL_DA_BIOFARMA: http://farmacia-biofarma:8101
      URL_DA_FARMAAZUL: http://farmacia-farmaazul:8102
      URL_DA_DROGAPOPULAR: http://farmacia-drogapopular:8103
      URL_DAS_VITRINES: http://localhost:5176
      SEGREDO_DO_WEBHOOK_BIOFARMA: ${SEGREDO_DO_WEBHOOK_BIOFARMA:-segredo-biofarma-dev}
      SEGREDO_DO_WEBHOOK_FARMAAZUL: ${SEGREDO_DO_WEBHOOK_FARMAAZUL:-segredo-farmaazul-dev}
      INTERVALO_DE_POLLING_S: ${INTERVALO_DE_POLLING_S:-15}
      INTERVALO_DE_RECONCILIACAO_S: ${INTERVALO_DE_RECONCILIACAO_S:-120}

  ms-catalogo:
    <<: *servico-python
    build:
      context: ./backend
      args:
        SERVICO: ms-catalogo
    image: pricehub/ms-catalogo:local
    environment:
      <<: *ambiente-comum
      PORTA: "8002"
      URL_DO_BANCO: postgresql+asyncpg://${POSTGRES_USUARIO:-pricehub}:${POSTGRES_SENHA:-pricehub}@postgres:5432/catalogo

  ms-log:
    <<: *servico-python
    build:
      context: ./backend
      args:
        SERVICO: ms-log
    image: pricehub/ms-log:local
    environment:
      <<: *ambiente-comum
      PORTA: "8003"
      URL_DO_BANCO: postgresql+asyncpg://${POSTGRES_USUARIO:-pricehub}:${POSTGRES_SENHA:-pricehub}@postgres:5432/auditoria
      URL_DA_API_DO_RABBITMQ: http://rabbitmq:15672/api
      USUARIO_DO_RABBITMQ: ${RABBITMQ_USUARIO:-pricehub}
      SENHA_DO_RABBITMQ: ${RABBITMQ_SENHA:-pricehub}
      SERVICOS_MONITORADOS: >-
        ms-ingestao=http://ms-ingestao:8001,ms-catalogo=http://ms-catalogo:8002,ms-log=http://ms-log:8003,
        ms-consulta=http://ms-consulta:8004,ms-bff=http://ms-bff:8000,
        farmacia-biofarma=http://farmacia-biofarma:8101,farmacia-farmaazul=http://farmacia-farmaazul:8102,
        farmacia-drogapopular=http://farmacia-drogapopular:8103
      URL_PUBLICA_DOS_SERVICOS: >-
        ms-ingestao=http://localhost:8000/ingestao,ms-catalogo=http://localhost:8000/catalogo,ms-log=http://localhost:8000/log,
        ms-consulta=http://localhost:8000/consulta,ms-bff=http://localhost:8000,
        farmacia-biofarma=http://localhost:8000/farmacias/biofarma,farmacia-farmaazul=http://localhost:8000/farmacias/farmaazul,
        farmacia-drogapopular=http://localhost:8000/farmacias/drogapopular

  ms-consulta:
    <<: *servico-python
    build:
      context: ./backend
      args:
        SERVICO: ms-consulta
    image: pricehub/ms-consulta:local
    environment:
      <<: *ambiente-comum
      PORTA: "8004"
      URL_DO_BANCO: postgresql+asyncpg://${POSTGRES_USUARIO:-pricehub}:${POSTGRES_SENHA:-pricehub}@postgres:5432/consulta
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-catalogo:
        condition: service_healthy

  ms-bff:
    <<: *servico-python
    build:
      context: ./backend
      args:
        SERVICO: ms-bff
    image: pricehub/ms-bff:local
    depends_on: []
    environment:
      <<: *ambiente-comum
      PORTA: "8000"
      URL_DO_CATALOGO: http://ms-catalogo:8002
      URL_DA_CONSULTA: http://ms-consulta:8004
      URL_DA_INGESTAO: http://ms-ingestao:8001
      URL_DO_LOG: http://ms-log:8003
      URL_DA_BIOFARMA: http://farmacia-biofarma:8101
      URL_DA_FARMAAZUL: http://farmacia-farmaazul:8102
      URL_DA_DROGAPOPULAR: http://farmacia-drogapopular:8103
    ports:
      - "8000:8000"

  farmacia-biofarma:
    <<: *farmacia
    environment:
      FARMACIA_ID: biofarma
      PORTA: "8101"
      URL_DO_MS_INGESTAO: http://ms-ingestao:8001
      SEGREDO_DO_WEBHOOK: ${SEGREDO_DO_WEBHOOK_BIOFARMA:-segredo-biofarma-dev}
      CORS_ORIGENS: "*"
    ports:
      - "8101:8101"

  farmacia-farmaazul:
    <<: *farmacia
    environment:
      FARMACIA_ID: farmaazul
      PORTA: "8102"
      URL_DO_MS_INGESTAO: http://ms-ingestao:8001
      SEGREDO_DO_WEBHOOK: ${SEGREDO_DO_WEBHOOK_FARMAAZUL:-segredo-farmaazul-dev}
      CORS_ORIGENS: "*"
    ports:
      - "8102:8102"

  farmacia-drogapopular:
    <<: *farmacia
    environment:
      FARMACIA_ID: drogapopular
      PORTA: "8103"
      CORS_ORIGENS: "*"
    ports:
      - "8103:8103"

  frontend:
    build: ./frontend
    image: pricehub/frontend:local
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
      - "5176:5176"

volumes:
  dados-postgres:
  dados-rabbitmq:
