[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricehub-common"
version = "1.0.0"
description = "Biblioteca compartilhada dos microsserviços do PriceHub: contratos de eventos, mensageria RabbitMQ, logs estruturados e fábrica de aplicações FastAPI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "aio-pika>=9.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["pricehub_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
